<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Diablo Desktop HUD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100vh;
            padding-bottom: 20px;
        }

        /* Draggable Header / Wrapper */
        .drag-handle {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40px;
            cursor: move;
            z-index: 10;
        }

        /* Speech Bubble */
        .speech-bubble {
            background: rgba(17, 24, 39, 0.92);
            border: 1px solid rgba(239, 68, 68, 0.6);
            backdrop-filter: blur(10px);
            color: #f3f4f6;
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 13px;
            max-width: 280px;
            text-align: center;
            margin-bottom: 12px;
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.25);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
            z-index: 4;
        }
        .speech-bubble.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .speech-title {
            font-weight: bold;
            color: #ef4444;
            margin-bottom: 4px;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Avatar Container */
        .diablo-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2;
        }

        /* Magic Circle under avatar */
        .magic-circle {
            position: absolute;
            width: 210px;
            height: 210px;
            border-radius: 50%;
            background-image: url('assets/diablo_circle.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.75;
            filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.8));
            animation: rotateCircle 25s linear infinite;
            transition: all 0.4s ease;
            z-index: 1;
        }

        /* Avatar Portrait */
        .avatar-img {
            position: relative;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6), inset 0 0 15px rgba(0,0,0,0.8);
            z-index: 2;
            animation: floatAvatar 4s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        /* States */
        .state-listening .magic-circle {
            animation: rotateCircle 5s linear infinite, pulseGlow 1.2s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 25px #ef4444) brightness(1.3);
        }
        .state-listening .avatar-img {
            border-color: #f59e0b;
            box-shadow: 0 0 30px #ef4444;
            transform: scale(1.05);
        }

        .state-thinking .magic-circle {
            animation: rotateCircle 2s linear infinite;
            filter: drop-shadow(0 0 30px #8b5cf6) hue-rotate(45deg);
        }

        .state-halted .magic-circle {
            animation: none;
            filter: grayscale(100%) opacity(0.3);
        }
        .state-halted .avatar-img {
            border-color: #6b7280;
            filter: grayscale(80%);
            box-shadow: 0 0 10px #374151;
        }

        /* Mini Quick Control Bar */
        .controls-bar {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            background: rgba(17, 24, 39, 0.85);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(55, 65, 81, 0.7);
            z-index: 3;
            backdrop-filter: blur(8px);
        }
        .btn-ctrl {
            background: transparent;
            border: none;
            color: #9ca3af;
            font-size: 12px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 10px;
            transition: all 0.2s;
        }
        .btn-ctrl:hover {
            color: #fff;
            background: rgba(239, 68, 68, 0.3);
        }
        .btn-mic {
            color: #ef4444;
            font-weight: bold;
        }

        @keyframes rotateCircle {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes floatAvatar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes pulseGlow {
            from { transform: scale(0.95) rotate(0deg); }
            to { transform: scale(1.05) rotate(180deg); }
        }
    </style>
</head>
<body class="state-idle" id="hudBody">

    <!-- Draggable region for window moving -->
    <div class="pywebview-drag-region drag-handle"></div>

    <!-- Speech Bubble -->
    <div class="speech-bubble" id="speechBubble">
        <div class="speech-title">Diablo</div>
        <div id="speechText">At your service, Lord Ivine.</div>
    </div>

    <!-- Reactive Diablo Avatar -->
    <div class="diablo-wrapper" onclick="triggerListen()">
        <div class="magic-circle"></div>
        <img class="avatar-img" src="assets/diablo.jpg" alt="Diablo">
    </div>

    <!-- Quick Control Bar -->
    <div class="controls-bar">
        <button class="btn-ctrl btn-mic" onclick="triggerListen()">🎤 Speak</button>
        <button class="btn-ctrl" onclick="toggleProfile()">⚡ <span id="profLabel">Balanced</span></button>
        <button class="btn-ctrl" onclick="openDashboard()">📊 Mission Control</button>
        <button class="btn-ctrl" onclick="emergencyHalt()" style="color:#ef4444;">🛑 Halt</button>
    </div>

    <script>
        function setState(stateName) {
            document.getElementById('hudBody').className = 'state-' + stateName;
        }

        function showSpeech(text, duration = 4000) {
            const bubble = document.getElementById('speechBubble');
            document.getElementById('speechText').innerText = text;
            bubble.classList.add('active');
            if (duration > 0) {
                setTimeout(() => {
                    bubble.classList.remove('active');
                }, duration);
            }
        }

        function triggerListen() {
            setState('listening');
            showSpeech("Listening... (Speak now)", 3000);
            if (window.pywebview) {
                window.pywebview.api.listen_and_respond().then(res => {
                    setState('idle');
                    if (res) showSpeech(res, 6000);
                });
            }
        }

        function toggleProfile() {
            if (window.pywebview) {
                window.pywebview.api.toggle_profile().then(p => {
                    document.getElementById('profLabel').innerText = p;
                    showSpeech("Switched to " + p + " profile.", 3000);
                });
            }
        }

        function openDashboard() {
            if (window.pywebview) {
                window.pywebview.api.open_dashboard();
            }
        }

        function emergencyHalt() {
            setState('halted');
            showSpeech("EMERGENCY HALT TRIGGERED. System is in read-only idle.", 4000);
            if (window.pywebview) {
                window.pywebview.api.trigger_emergency_halt();
            }
        }
    </script>
</body>
</html>
